name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-quality:
    name: Backend quality and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run generate

      - name: Lint
        run: npm run lint:backend

      - name: Type-check
        run: npm run typecheck

      - name: Test with backend coverage
        run: npm run coverage:backend

      - name: Build
        run: npm run build:backend

      - name: Check tracked files for secrets and AI attribution
        run: npm run security:check

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: backend
          name: tutor-mx-backend
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  frontend-quality:
    name: Frontend quality and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test with frontend coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
          name: tutor-mx-frontend
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  postgres-integration:
    name: Clean PostgreSQL migration and API smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The shared Gitea runner does not expose `services:` container networking
    # to this job. Run Node and an isolated PostgreSQL process inside the same
    # disposable job container instead.
    container: node:24-bookworm
    env:
      DATABASE_URL: postgresql://tutor_mx@127.0.0.1:15432/tutor_mx
      PGDATA: /tmp/tutor-mx-postgres-data
      PGPORT: 15432
      PORT: 3000

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL inside the job container
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install --yes --no-install-recommends postgresql postgresql-client

      - name: Run clean migrations, verification and API smoke
        run: |
          set -euo pipefail

          pg_bin="$(find /usr/lib/postgresql -type f -name initdb -printf '%h\n' | sort -V | tail -n 1)"
          if [ -z "$pg_bin" ]; then
            echo "PostgreSQL binaries were not installed."
            exit 1
          fi

          install -d -m 0700 -o postgres -g postgres "$PGDATA"
          runuser -u postgres -- "$pg_bin/initdb" \
            --pgdata="$PGDATA" \
            --username=tutor_mx \
            --auth-local=trust \
            --auth-host=trust \
            --encoding=UTF8 \
            --no-locale

          runuser -u postgres -- "$pg_bin/pg_ctl" \
            --pgdata="$PGDATA" \
            --log=/tmp/tutor-mx-postgres.log \
            --options="-h 127.0.0.1 -p $PGPORT" \
            --wait start

          api_pid=""
          cleanup() {
            if [ -n "$api_pid" ]; then
              kill "$api_pid" 2>/dev/null || true
              wait "$api_pid" 2>/dev/null || true
            fi
            runuser -u postgres -- "$pg_bin/pg_ctl" \
              --pgdata="$PGDATA" --mode=fast --wait stop 2>/dev/null || true
          }
          trap cleanup EXIT

          runuser -u postgres -- "$pg_bin/createdb" \
            --host=127.0.0.1 \
            --port="$PGPORT" \
            --username=tutor_mx \
            tutor_mx

          node --input-type=module <<'NODE'
          import pg from "pg";

          const client = new pg.Client({
            connectionString: process.env.DATABASE_URL,
            connectionTimeoutMillis: 5_000,
          });

          await client.connect();
          const result = await client.query(`
            SELECT
              current_setting('data_directory') AS data_dir,
              current_user AS db_user,
              current_database() AS db_name
          `);
          await client.end();

          const row = result.rows[0];
          if (
            row?.data_dir !== process.env.PGDATA ||
            row?.db_user !== "tutor_mx" ||
            row?.db_name !== "tutor_mx"
          ) {
            throw new Error("Connected to an unexpected PostgreSQL instance.");
          }
          console.log("Isolated PostgreSQL CI database is ready.");
          NODE

          npm run generate
          npm run db:migrate
          npm run db:seed
          npm run db:verify
          npm run build:backend

          node dist/server.js > /tmp/tutor-mx-api.log 2>&1 &
          api_pid=$!
          env \
            -u HTTP_PROXY \
            -u HTTPS_PROXY \
            -u ALL_PROXY \
            -u http_proxy \
            -u https_proxy \
            -u all_proxy \
            NODE_USE_ENV_PROXY=0 \
            NO_PROXY=127.0.0.1,localhost \
            no_proxy=127.0.0.1,localhost \
            SMOKE_BASE_URL=http://127.0.0.1:3000 \
            npm run smoke || {
            sed -n '1,120p' /tmp/tutor-mx-api.log
            exit 1
          }