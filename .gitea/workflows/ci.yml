name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-quality:
    name: Backend quality and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run generate

      - name: Lint
        run: npm run lint:backend

      - name: Type-check
        run: npm run typecheck

      - name: Test with backend coverage
        run: npm run coverage:backend

      - name: Build
        run: npm run build:backend

      - name: Check tracked files for secrets and AI attribution
        run: npm run security:check

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: backend
          name: tutor-mx-backend
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  frontend-quality:
    name: Frontend quality and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test with frontend coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
          name: tutor-mx-frontend
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  postgres-integration:
    name: Clean PostgreSQL migration and API smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PORT: 3000

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tutor_mx
          POSTGRES_PASSWORD: tutor_mx
          POSTGRES_DB: tutor_mx
          # This database exists only for this CI job. Trust auth removes any
          # dependency on password state left by a shared runner/service setup.
          POSTGRES_HOST_AUTH_METHOD: trust
          # A unique in-container data directory proves that the workflow is
          # talking to this service rather than some other PostgreSQL instance.
          PGDATA: /tmp/tutor-mx-postgres-data
        ports:
          # Keep the normal service port inside Docker, but expose a different
          # host port for runners that execute job steps directly on the host.
          - 15432:5432
        options: --no-healthcheck

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Find and verify the PostgreSQL service
        timeout-minutes: 2
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import pg from "pg";

          const expectedDataDirectory = "/tmp/tutor-mx-postgres-data";
          const outputFile = "/tmp/tutor-mx-ci-database-url";

          // Gitea act_runner can execute jobs either in a Docker job container
          // or directly on the runner host. Support both networking models.
          const candidates = [
            {
              label: "runner-host mapped port",
              url: "postgresql://tutor_mx:tutor_mx@127.0.0.1:15432/tutor_mx",
            },
            {
              label: "runner-host mapped port (trust)",
              url: "postgresql://tutor_mx@127.0.0.1:15432/tutor_mx",
            },
            {
              label: "service alias",
              url: "postgresql://tutor_mx:tutor_mx@postgres:5432/tutor_mx",
            },
            {
              label: "service alias (trust)",
              url: "postgresql://tutor_mx@postgres:5432/tutor_mx",
            },
          ];

          const deadline = Date.now() + 90_000;
          const lastErrors = new Map();

          while (Date.now() < deadline) {
            for (const candidate of candidates) {
              const client = new pg.Client({
                connectionString: candidate.url,
                connectionTimeoutMillis: 2_000,
                query_timeout: 2_000,
              });

              try {
                await client.connect();
                const result = await client.query(`
                  SELECT
                    current_setting('data_directory') AS data_dir,
                    current_user AS db_user,
                    current_database() AS db_name
                `);
                const row = result.rows[0];

                if (
                  row?.data_dir !== expectedDataDirectory ||
                  row?.db_user !== "tutor_mx" ||
                  row?.db_name !== "tutor_mx"
                ) {
                  throw new Error(
                    `connected to the wrong PostgreSQL instance ` +
                      `(data_dir=${row?.data_dir ?? "unknown"}, ` +
                      `user=${row?.db_user ?? "unknown"}, ` +
                      `db=${row?.db_name ?? "unknown"})`,
                  );
                }

                await client.query("SELECT 1");
                await client.end();
                fs.writeFileSync(outputFile, candidate.url, { encoding: "utf8", mode: 0o600 });
                console.log(`PostgreSQL CI service is ready via ${candidate.label}.`);
                process.exit(0);
              } catch (error) {
                lastErrors.set(candidate.label, error instanceof Error ? error.message : String(error));
                try {
                  await client.end();
                } catch {}
              }
            }

            await new Promise((resolve) => setTimeout(resolve, 2_000));
          }

          console.error("Could not reach the intended PostgreSQL CI service within 90 seconds.");
          for (const [label, message] of lastErrors) {
            console.error(`${label}: ${message}`);
          }
          process.exit(1);
          NODE

      - name: Generate Prisma Client
        run: |
          export DATABASE_URL="$(cat /tmp/tutor-mx-ci-database-url)"
          npm run generate

      - name: Deploy clean migrations
        run: |
          export DATABASE_URL="$(cat /tmp/tutor-mx-ci-database-url)"
          npm run db:migrate

      - name: Load safe demo data
        run: |
          export DATABASE_URL="$(cat /tmp/tutor-mx-ci-database-url)"
          npm run db:seed

      - name: Verify constraints and allocation queries
        run: |
          export DATABASE_URL="$(cat /tmp/tutor-mx-ci-database-url)"
          npm run db:verify

      - name: Build API
        run: |
          export DATABASE_URL="$(cat /tmp/tutor-mx-ci-database-url)"
          npm run build:backend

      - name: Smoke local health and readiness
        run: |
          export DATABASE_URL="$(cat /tmp/tutor-mx-ci-database-url)"
          npm start > /tmp/tutor-mx-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          SMOKE_BASE_URL=http://127.0.0.1:3000 npm run smoke || {
            sed -n '1,120p' /tmp/tutor-mx-api.log
            exit 1
          }
