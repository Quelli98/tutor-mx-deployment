name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-quality:
    name: Backend quality and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run generate

      - name: Lint
        run: npm run lint:backend

      - name: Type-check
        run: npm run typecheck

      - name: Test with backend coverage
        run: npm run coverage:backend

      - name: Build
        run: npm run build:backend

      - name: Check tracked files for secrets and AI attribution
        run: npm run security:check

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: backend
          name: tutor-mx-backend
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  frontend-quality:
    name: Frontend quality and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test with frontend coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
          name: tutor-mx-frontend
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  postgres-integration:
    name: Clean PostgreSQL migration and API smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://tutor_mx@postgres:5432/tutor_mx
      PGPASSWORD: tutor_mx
      PORT: 3000

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tutor_mx
          POSTGRES_PASSWORD: tutor_mx
          POSTGRES_DB: tutor_mx
        ports:
          - 5432:5432
        # The shared Gitea runners have repeatedly marked the service unhealthy
        # before the repository steps start. Readiness is checked explicitly below
        # over the job/service Docker network instead.
        options: --no-healthcheck

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure integration database URL
        run: |
          db_prefix='postgresql://tutor_mx:'
          echo "DATABASE_URL=${db_prefix}${PGPASSWORD}@postgres:5432/tutor_mx" >> "$GITHUB_ENV"

      - name: Wait for PostgreSQL readiness
        timeout-minutes: 2
        run: |
          node --input-type=module <<'NODE'
          import pg from "pg";

          const deadline = Date.now() + 120_000;
          let lastError;

          while (Date.now() < deadline) {
            const client = new pg.Client({
              host: "postgres",
              port: 5432,
              user: "tutor_mx",
              password: process.env.PGPASSWORD,
              database: "tutor_mx",
              connectionTimeoutMillis: 2_000,
            });

            try {
              await client.connect();
              await client.query("SELECT 1");
              await client.end();
              console.log("PostgreSQL is ready.");
              process.exit(0);
            } catch (error) {
              lastError = error;
              try {
                await client.end();
              } catch {}
              console.log(`PostgreSQL not ready yet: ${error.message}`);
              await new Promise((resolve) => setTimeout(resolve, 2_000));
            }
          }

          console.error("PostgreSQL did not become ready within 120 seconds.");
          if (lastError) {
            console.error(lastError.message);
          }
          process.exit(1);
          NODE

      - name: Generate Prisma Client
        run: npm run generate

      - name: Deploy clean migrations
        run: npm run db:migrate

      - name: Load safe demo data
        run: npm run db:seed

      - name: Verify constraints and allocation queries
        run: npm run db:verify

      - name: Build API
        run: npm run build:backend

      - name: Smoke local health and readiness
        run: |
          npm start > /tmp/tutor-mx-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          SMOKE_BASE_URL=http://127.0.0.1:3000 npm run smoke || {
            sed -n '1,120p' /tmp/tutor-mx-api.log
            exit 1
          }
