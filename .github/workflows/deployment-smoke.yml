name: Deployment smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployed-health:
    name: Deployed health and readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SMOKE_BASE_URL: ${{ secrets.DEPLOYMENT_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check deployed health and readiness
        run: npm run smoke
